apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: ${NAMESPACE}
  labels:
    app: python-app
    branch: ${BRANCH_NAME}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: python-app
          image: ${DOCKER_IMAGE}
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "${BRANCH_NAME}"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:               
              memory: "128Mi"       
              cpu: "250m"           
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000